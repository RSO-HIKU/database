apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres.fullname" . }}-init-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
data:
  01-init-schemas.sql: |
    -- Initialize schemas for microservices
    
    CREATE SCHEMA IF NOT EXISTS authentication_service;
    CREATE SCHEMA IF NOT EXISTS user_service;
    CREATE SCHEMA IF NOT EXISTS peaks_hikes_service;
    CREATE SCHEMA IF NOT EXISTS trail_import_service;
    CREATE SCHEMA IF NOT EXISTS weather_service;
    CREATE SCHEMA IF NOT EXISTS social_feed_service;
    CREATE SCHEMA IF NOT EXISTS badge_service;
    CREATE SCHEMA IF NOT EXISTS scoreboards_challenges_service;
    CREATE SCHEMA IF NOT EXISTS activity_service;
    CREATE SCHEMA IF NOT EXISTS notification_service;
    
    -- Enable extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS postgis;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    
    -- Set default privileges
    ALTER DEFAULT PRIVILEGES IN SCHEMA authentication_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;
    ALTER DEFAULT PRIVILEGES IN SCHEMA user_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;
    ALTER DEFAULT PRIVILEGES IN SCHEMA peaks_hikes_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;
    ALTER DEFAULT PRIVILEGES IN SCHEMA trail_import_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;
    ALTER DEFAULT PRIVILEGES IN SCHEMA weather_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;
    ALTER DEFAULT PRIVILEGES IN SCHEMA social_feed_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;
    ALTER DEFAULT PRIVILEGES IN SCHEMA badge_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;
    ALTER DEFAULT PRIVILEGES IN SCHEMA scoreboards_challenges_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;
    ALTER DEFAULT PRIVILEGES IN SCHEMA activity_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;
    ALTER DEFAULT PRIVILEGES IN SCHEMA notification_service GRANT ALL PRIVILEGES ON TABLES TO hikuuser;