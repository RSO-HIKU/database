apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgres.fullname" . }}-db-bootstrap
  namespace: {{ .Release.Namespace }}
#   annotations:
#     "helm.sh/hook": post-install,post-upgrade
#     "helm.sh/hook-weight": "1"
#     "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "postgres.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: {{ include "postgres.fullname" . }}
            - name: PGPORT
              value: "{{ .Values.service.port }}"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: POSTGRES_USER
          command: ["sh", "-c", "until pg_isready; do :; done"]
      containers:
        - name: flyway
          image: "{{ .Values.flyway.image.repository }}:{{ .Values.flyway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Never
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: FLYWAY_URL
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: FLYWAY_TABLE
              value: {{ .Values.flyway.table | quote }}
          args: ["migrate"] 